<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Admin — ACIDIC STUDIOS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link href="https://fontlibrary.org//face/vintage-propagandist" media="screen" rel="stylesheet" type="text/css"
    <link rel="stylesheet" href="assets/css/main.css">>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script id="tailwind-config">
tailwind.config={darkMode:"class",theme:{extend:{"colors":{"primary-fixed":"#8bfe00","on-primary-fixed":"#0d2000","border-muted":"#262626","on-surface":"#e5e2e1","on-surface-variant":"#becbae","surface-deep":"#121212","surface-container":"#201f1f","surface-container-lowest":"#0e0e0e","primary":"#ffffff","error":"#ffb4ab"},"fontFamily":{"headline":["Montserrat", "sans-serif"],"label":["JetBrains Mono"],"body":["Inter"]}}}}
</script>
<style>
  body{background-color:#0A0A0A;color:#e5e2e1;overflow-x:hidden;font-family:"Inter",sans-serif}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#0A0A0A}::-webkit-scrollbar-thumb{background:#262626}::-webkit-scrollbar-thumb:hover{background:#8bfe00}
  .btn-tag{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:background-color .2s,color .2s,box-shadow .2s;cursor:pointer;border:none}
  .btn-fill{background-color:#8bfe00;color:#0d2000}
  .btn-fill:hover{background-color:#0A0A0A;color:#8bfe00;box-shadow:inset 0 0 0 1px #8bfe00}
  .btn-ghost{background-color:transparent;color:#8bfe00;box-shadow:inset 0 0 0 1px rgba(139,254,0,0.4)}
  .btn-ghost:hover{background-color:#8bfe00;color:#0d2000}
  .btn-danger{background-color:transparent;color:#f87171;box-shadow:inset 0 0 0 1px rgba(248,113,113,0.4)}
  .btn-danger:hover{background-color:#f87171;color:#0A0A0A}
  .field{background-color:rgba(18,18,18,0.8);border:1px solid #262626;color:#e5e2e1;padding:12px 16px;font-family:"Inter";width:100%;transition:border-color .2s}
  .field:focus{outline:none;border-color:#8bfe00}
  .field::placeholder{color:#4a4a4a}
  .card{background:#0e0e0e;border:1px solid #262626;padding:1.5rem}
  .toast{position:fixed;bottom:2rem;right:2rem;padding:1rem 1.5rem;font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;z-index:999;transition:opacity .3s}
</style>
</head>
<body>
<!-- LOGIN -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <span class="font-headline text-2xl tracking-wide text-primary" style="font-family:'Montserrat", "sans-serif">ACIDIC</span>
      <p class="font-label text-[10px] text-on-surface-variant uppercase tracking-widest mt-2" style="font-family:'JetBrains Mono',monospace">Admin Panel</p>
    </div>
    <div class="card">
      <label class="block font-label text-[10px] text-on-surface-variant uppercase tracking-widest mb-3" style="font-family:'JetBrains Mono',monospace">Password</label>
      <input id="pwInput" class="field mb-4" type="password" placeholder="Enter password">
      <button onclick="login()" class="btn-tag btn-fill w-full justify-center">Enter</button>
      <p id="loginError" class="hidden mt-3 text-red-400 text-[11px] font-label uppercase tracking-widest" style="font-family:'JetBrains Mono',monospace">Incorrect password</p>
    </div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden min-h-screen">
  <!-- Header -->
  <header class="border-b border-border-muted px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <span class="font-headline text-xl tracking-wide text-primary" style="font-family:'Montserrat", "sans-serif">ACIDIC</span>
      <span class="font-label text-[10px] text-on-surface-variant uppercase tracking-widest" style="font-family:'JetBrains Mono',monospace">// Blog Admin</span>
    </div>
    <button onclick="logout()" class="btn-tag btn-ghost text-[10px]">
      <span class="material-symbols-outlined text-[14px]">logout</span>Logout
    </button>
  </header>

  <div class="max-w-[1200px] mx-auto px-6 py-10">
    <!-- New Post Form -->
    <div class="card mb-10">
      <h2 class="font-label text-[13px] text-primary uppercase tracking-widest mb-6 border-b border-border-muted pb-4" style="font-family:'JetBrains Mono',monospace" id="formTitle">New Post</h2>
      <input type="hidden" id="editId">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block font-label text-[10px] text-on-surface-variant uppercase tracking-widest mb-2" style="font-family:'JetBrains Mono',monospace">Title *</label>
          <input id="fTitle" class="field" placeholder="Post title">
        </div>
        <div>
          <label class="block font-label text-[10px] text-on-surface-variant uppercase tracking-widest mb-2" style="font-family:'JetBrains Mono',monospace">Slug *</label>
          <input id="fSlug" class="field" placeholder="post-slug">
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block font-label text-[10px] text-on-surface-variant uppercase tracking-widest mb-2" style="font-family:'JetBrains Mono',monospace">Category</label>
          <input id="fCategory" class="field" placeholder="e.g. AI Video">
        </div>
        <div>
          <label class="block font-label text-[10px] text-on-surface-variant uppercase tracking-widest mb-2" style="font-family:'JetBrains Mono',monospace">Image URL</label>
          <input id="fImage" class="field" placeholder="https://...">
        </div>
      </div>
      <div class="mb-4">
        <label class="block font-label text-[10px] text-on-surface-variant uppercase tracking-widest mb-2" style="font-family:'JetBrains Mono',monospace">Description</label>
        <textarea id="fDesc" class="field" rows="2" placeholder="Short description"></textarea>
      </div>
      <div class="mb-6">
        <label class="block font-label text-[10px] text-on-surface-variant uppercase tracking-widest mb-2" style="font-family:'JetBrains Mono',monospace">Content (HTML)</label>
        <textarea id="fContent" class="field" rows="8" placeholder="Full post content..."></textarea>
      </div>
      <div class="flex gap-3">
        <button onclick="savePost()" class="btn-tag btn-fill">Save Post</button>
        <button onclick="clearForm()" class="btn-tag btn-ghost">Clear</button>
      </div>
    </div>

    <!-- Posts List -->
    <div>
      <h2 class="font-label text-[13px] text-primary uppercase tracking-widest mb-6 border-b border-border-muted pb-4" style="font-family:'JetBrains Mono',monospace">All Posts</h2>
      <div id="postsList" class="space-y-3">
        <p class="font-label text-[11px] text-on-surface-variant uppercase tracking-widest" style="font-family:'JetBrains Mono',monospace">Loading...</p>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
  const ADMIN_PASSWORD = 'acidic2025';
  const SUPABASE_URL = 'https://npunrjejzvbjsxpsouuq.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wdW5yamVqenZianN4cHNvdXVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0Njg4NzEsImV4cCI6MjEwMDA0NDg3MX0.bFUZRI5se1mSD1bMwmh-kFN70gNk6gI-Ov3ysbFxCfc';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function login() {
    if (document.getElementById('pwInput').value === ADMIN_PASSWORD) {
      sessionStorage.setItem('acidic_admin', '1');
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      loadPosts();
    } else {
      document.getElementById('loginError').classList.remove('hidden');
    }
  }

  function logout() {
    sessionStorage.removeItem('acidic_admin');
    location.reload();
  }

  function showToast(msg, ok = true) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = ok ? '#8bfe00'; t.style.color = ok ? '#0d2000' : '#fff';
    if (!ok) t.style.background = '#7f1d1d';
    t.classList.remove('hidden');
    setTimeout(() => t.classList.add('hidden'), 3000);
  }

  async function loadPosts() {
    const { data, error } = await sb.from('posts').select('*').order('created_at', { ascending: false });
    const el = document.getElementById('postsList');
    if (error) { el.innerHTML = `<p class="text-red-400 text-sm">${error.message}</p>`; return; }
    if (!data.length) { el.innerHTML = '<p class="font-label text-[11px] text-on-surface-variant uppercase tracking-widest" style="font-family:\'JetBrains Mono\',monospace">No posts yet.</p>'; return; }
    el.innerHTML = data.map(p => `
      <div class="card flex items-center justify-between gap-4">
        <div>
          <p class="font-label text-[13px] text-primary uppercase tracking-widest" style="font-family:'JetBrains Mono',monospace">${p.title}</p>
          <p class="font-label text-[10px] text-on-surface-variant uppercase tracking-widest mt-1" style="font-family:'JetBrains Mono',monospace">${p.slug} · ${p.category || '—'}</p>
        </div>
        <div class="flex gap-2 shrink-0">
          <button onclick="editPost(${JSON.stringify(p).replace(/"/g,'&quot;')})" class="btn-tag btn-ghost text-[10px]">Edit</button>
          <button onclick="deletePost('${p.id}')" class="btn-tag btn-danger text-[10px]">Delete</button>
        </div>
      </div>`).join('');
  }

  async function savePost() {
    const id = document.getElementById('editId').value;
    const payload = {
      title: document.getElementById('fTitle').value,
      slug: document.getElementById('fSlug').value,
      description: document.getElementById('fDesc').value,
      content: document.getElementById('fContent').value,
      image: document.getElementById('fImage').value,
      category: document.getElementById('fCategory').value,
    };
    if (!payload.title || !payload.slug) { showToast('Title and slug required', false); return; }
    const { error } = id
      ? await sb.from('posts').update(payload).eq('id', id)
      : await sb.from('posts').insert(payload);
    if (error) { showToast(error.message, false); return; }
    showToast(id ? 'Post updated' : 'Post created');
    clearForm();
    loadPosts();
  }

  async function deletePost(id) {
    if (!confirm('Delete this post?')) return;
    const { error } = await sb.from('posts').delete().eq('id', id);
    if (error) { showToast(error.message, false); return; }
    showToast('Post deleted');
    loadPosts();
  }

  function editPost(p) {
    document.getElementById('editId').value = p.id;
    document.getElementById('fTitle').value = p.title || '';
    document.getElementById('fSlug').value = p.slug || '';
    document.getElementById('fDesc').value = p.description || '';
    document.getElementById('fContent').value = p.content || '';
    document.getElementById('fImage').value = p.image || '';
    document.getElementById('fCategory').value = p.category || '';
    document.getElementById('formTitle').textContent = 'Edit Post';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function clearForm() {
    ['editId','fTitle','fSlug','fDesc','fContent','fImage','fCategory'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('formTitle').textContent = 'New Post';
  }

  document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

  if (sessionStorage.getItem('acidic_admin') === '1') {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
    loadPosts();
  }
</script>
</body></html>
