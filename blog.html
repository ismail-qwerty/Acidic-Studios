<style>
  /* Vertical/portrait cards — image dominates, content sits below it,
     3 across on desktop. Deliberately tall, not a short horizontal banner. */
  .blog-card { display: flex; flex-direction: column; background: #0e0e0e; border: 1px solid #232323; border-radius: 24px; overflow: hidden; text-decoration: none; transition: border-color .25s ease, transform .25s ease, box-shadow .25s ease; height: 100%; }
  .blog-card:hover { border-color: rgba(139,254,0,0.45); transform: translateY(-4px); box-shadow: 0 24px 44px -24px rgba(0,0,0,0.65); }
  .blog-media { position: relative; overflow: hidden; background: #000; aspect-ratio: 3 / 4; flex-shrink: 0; }
  .blog-media img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease; }
  .blog-card:hover .blog-media img { transform: scale(1.05); }
  .blog-card-body { flex: 1; display: flex; flex-direction: column; }

  /* Featured post — full-bleed cinematic block, distinct from the grid cards */
  .featured-card { display: block; position: relative; border-radius: 28px; overflow: hidden; text-decoration: none; border: 1px solid #232323; transition: border-color .25s ease; height: 280px; }
  @media (min-width: 640px) { .featured-card { height: 360px; } }
  @media (min-width: 768px) { .featured-card { height: 460px; } }
  .featured-card:hover { border-color: rgba(139,254,0,0.45); }
  .featured-media { position: absolute; inset: 0; background: #000; }
  .featured-media img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s ease; }
  .featured-card:hover .featured-media img { transform: scale(1.04); }

  /* Featured carousel — used instead of a single .featured-card when 2+
     posts are marked "featured" in admin. Slides move left-to-right on a
     5s auto-advance; the whole thing is just .featured-card slides laid
     side by side in a flex track that gets translateX'd. */
  .featured-carousel { position: relative; border-radius: 28px; overflow: hidden; border: 1px solid #232323; height: 280px; }
  @media (min-width: 640px) { .featured-carousel { height: 360px; } }
  @media (min-width: 768px) { .featured-carousel { height: 460px; } }
  .featured-track { display: flex; height: 100%; width: 100%; transition: transform .7s cubic-bezier(.65,0,.35,1); }
  .featured-slide { position: relative; flex: 0 0 100%; height: 100%; display: block; text-decoration: none; }
  .carousel-dots { position: absolute; z-index: 6; bottom: 20px; right: 22px; display: flex; gap: 8px; }
  .carousel-dot { width: 8px; height: 8px; padding: 0; border: none; border-radius: 999px; background: rgba(255,255,255,.3); cursor: pointer; transition: background-color .25s ease, width .25s ease; }
  .carousel-dot.active { background: #8bfe00; width: 24px; }
  @media (prefers-reduced-motion: reduce) { .featured-track { transition: none; } }

  .cat-pill { font-family:'JetBrains Mono',monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 9px 18px; border-radius: 999px; border: 1px solid #2a2a2a; color: #becbae; background: #0e0e0e; white-space: nowrap; cursor: pointer; transition: all .2s ease; }
  .cat-pill:hover { border-color: rgba(139,254,0,0.4); color: #e5e2e1; }
  .cat-pill.active { background: #8bfe00; border-color: #8bfe00; color: #0d2000; font-weight: 700; }
  .cat-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .cat-scroll::-webkit-scrollbar { display: none; }
</style>

<section class="max-w-[1280px] mx-auto px-margin-mobile md:px-margin-desktop pb-24 md:pb-32">
  <div id="feedStatus" class="hidden mb-12 border border-border-muted bg-surface-container-lowest/50 rounded-2xl px-6 sm:px-8 py-10 text-center"></div>
  <div id="featuredPost" class="mb-10 md:mb-12">

    <div class="rounded-[24px] border border-border-muted animate-pulse overflow-hidden flex flex-col"><div class="aspect-[3/4] bg-surface-container-lowest"></div><div class="p-6 flex flex-col gap-3"><div class="h-3 w-16 bg-surface-container-lowest rounded"></div><div class="h-5 w-5/6 bg-surface-container-lowest rounded"></div><div class="h-4 w-full bg-surface-container-lowest rounded"></div></div></div>
    <div class="rounded-[24px] border border-border-muted animate-pulse overflow-hidden flex-col hidden sm:flex"><div class="aspect-[3/4] bg-surface-container-lowest"></div><div class="p-6 flex flex-col gap-3"><div class="h-3 w-16 bg-surface-container-lowest rounded"></div><div class="h-5 w-5/6 bg-surface-container-lowest rounded"></div><div class="h-4 w-full bg-surface-container-lowest rounded"></div></div></div>
    <div class="rounded-[24px] border border-border-muted animate-pulse overflow-hidden flex-col hidden lg:flex"><div class="aspect-[3/4] bg-surface-container-lowest"></div><div class="p-6 flex flex-col gap-3"><div class="h-3 w-16 bg-surface-container-lowest rounded"></div><div class="h-5 w-5/6 bg-surface-container-lowest rounded"></div><div class="h-4 w-full bg-surface-container-lowest rounded"></div></div></div>

<script>
const SB_URL = 'https://joeoakmtmlmuktitfawh.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpvZW9ha210bWxtdWt0aXRmYXdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0NzE1NDQsImV4cCI6MjEwMDA0NzU0NH0.gBaitQdIOjzWFrubisVI8YffTJd6APzvcAYVgW1fPk4';

let allPosts = [];
let activeCategory = 'All';
let carouselTimer = null;
let carouselIndex = 0;

function esc(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
// Real <img> with onerror so a broken/expired image URL falls back to the
// chemical-grid placeholder instead of silently rendering nothing (which is
// what a CSS background-image does on a failed load).
function media(src, alt, extraClass){
  const safeAlt = esc(alt || '');
  if (!src) return `<div class="specimen-media absolute inset-0"></div>`;
  return `
    <img src="${esc(src)}" alt="${safeAlt}" loading="lazy" decoding="async" class="${extraClass || ''}"
         onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'specimen-media absolute inset-0'}))">`;
}
function showStatus(html){
  const el = document.getElementById('feedStatus');
  el.innerHTML = html;
  el.classList.remove('hidden');
  document.getElementById('featuredPost').innerHTML = '';
  document.getElementById('postsGrid').innerHTML = '';
  document.getElementById('catFilter').classList.add('hidden');
}

function renderCategories(posts){
  const cats = Array.from(new Set(posts.map(p => p.category).filter(Boolean)));
  const el = document.getElementById('catFilter');
  if (!cats.length) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  el.innerHTML = ['All', ...cats].map(c =>
    `<button class="cat-pill${c === activeCategory ? ' active' : ''}" data-cat="${esc(c)}">${esc(c)}</button>`
  ).join('');
  el.querySelectorAll('.cat-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCategory = btn.dataset.cat;
      el.querySelectorAll('.cat-pill').forEach(b => b.classList.toggle('active', b === btn));
      renderPosts();
    });
  });
}

// One slide's inner markup — shared by the single-card path and every
// slide in the carousel path, so they look identical either way.
function featuredSlideMarkup(p, badgeLabel){
  return `
    <a href="blog-post.html?slug=${encodeURIComponent(p.slug)}" class="featured-slide group">
      <div class="featured-media">${media(p.image, p.title, 'group-hover:scale-[1.04]')}</div>
      <div class="absolute inset-0 bg-gradient-to-t from-black via-black/55 to-transparent pointer-events-none"></div>
      <span class="absolute top-6 left-6 font-label-sm text-[10px] text-primary-fixed uppercase tracking-widest border border-primary-fixed/40 bg-black/60 backdrop-blur-sm px-3 py-1.5 rounded-full">${esc(badgeLabel)}</span>
      <div class="absolute inset-x-0 bottom-0 p-6 sm:p-8 md:p-12">
        <div class="flex items-center gap-3 mb-4">
          ${p.category ? `<span class="font-label-sm text-[10px] text-primary-fixed uppercase tracking-widest">${esc(p.category)}</span><span class="w-1 h-1 rounded-full bg-white/30"></span>` : ''}
          <span class="font-label-sm text-[10px] text-white/60 uppercase tracking-widest">${fmtDate(p.created_at)}</span>
        </div>
        <h2 class="font-headline-lg text-[26px] sm:text-[32px] md:text-[44px] text-white uppercase tracking-tight leading-[1.02] mb-4 max-w-2xl">${esc(p.title)}</h2>
        ${p.description ? `<p class="font-body-md text-white/75 text-[14px] mb-6 max-w-xl line-clamp-2 hidden sm:block">${esc(p.description)}</p>` : ''}
        <span class="btn-explore self-start">Read Full Story<span aria-hidden="true">→</span></span>
      </div>
    </a>`;
}

// Renders either a single full-bleed featured block, or — when 2+ posts
// are marked "featured" in admin — a carousel that auto-advances every 5s
// with a left-to-right slide transition.
function renderFeatured(slides, usingCuratedFeatured){
  clearInterval(carouselTimer);
  carouselTimer = null;
  carouselIndex = 0;
  const badge = usingCuratedFeatured ? 'Featured' : 'Latest';
  const el = document.getElementById('featuredPost');

  if (slides.length <= 1) {
    el.innerHTML = featuredSlideMarkup(slides[0], badge).replace('featured-slide group', 'featured-slide featured-card group');
    return;
  }

  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  el.innerHTML = `
    <div class="featured-carousel">
      <div class="featured-track" id="carouselTrack">
        ${slides.map(p => featuredSlideMarkup(p, badge)).join('')}
      </div>
      <div class="carousel-dots">
        ${slides.map((_, i) => `<button class="carousel-dot${i === 0 ? ' active' : ''}" data-i="${i}" aria-label="Go to slide ${i + 1}"></button>`).join('')}
      </div>
    </div>`;

  const track = document.getElementById('carouselTrack');
  const dots = el.querySelectorAll('.carousel-dot');

  function goTo(i){
    carouselIndex = (i + slides.length) % slides.length;
    track.style.transform = `translateX(-${carouselIndex * 100}%)`;
    dots.forEach((d, di) => d.classList.toggle('active', di === carouselIndex));
  }

  dots.forEach(dot => dot.addEventListener('click', () => {
    goTo(parseInt(dot.dataset.i, 10));
    resetTimer();
  }));

  function resetTimer(){
    if (reduceMotion) return; // dots still work manually; no forced auto-advance
    clearInterval(carouselTimer);
    carouselTimer = setInterval(() => { if (!document.hidden) goTo(carouselIndex + 1); }, 5000);
  }
  resetTimer();
}

function renderPosts(){
  const filtered = activeCategory === 'All' ? allPosts : allPosts.filter(p => p.category === activeCategory);

  if (!filtered.length) {
    clearInterval(carouselTimer);
    document.getElementById('featuredPost').innerHTML = '';
    document.getElementById('postsGrid').innerHTML = `<p class="col-span-full font-label-sm text-[11px] text-on-surface-variant uppercase tracking-widest text-center py-16">No dispatches in "${esc(activeCategory)}" yet.</p>`;
    return;
  }

  // Posts explicitly ticked "Featured" in admin drive the hero. Two or
  // more of them rotate as a carousel; exactly one just shows statically.
  // With none flagged, fall back to the most recent post (old behaviour).
  const curated = filtered.filter(p => p.featured);
  let heroSlides, rest;
  if (curated.length) {
    heroSlides = curated;
    const heroIds = new Set(curated.map(p => p.id));
    rest = filtered.filter(p => !heroIds.has(p.id));
  } else {
    heroSlides = filtered.slice(0, 1);
    rest = filtered.slice(1);
  }

  renderFeatured(heroSlides, curated.length > 0);

  // Grid — portrait/vertical cards, three across on desktop. Image
  // dominates the card (aspect-[3/4] via .blog-media), content sits in a
  // fixed body block below it so cards line up evenly.
  document.getElementById('postsGrid').innerHTML = rest.map(p => `
    <a href="blog-post.html?slug=${encodeURIComponent(p.slug)}" class="blog-card group">
      <div class="blog-media">
        ${media(p.image, p.title, 'absolute inset-0 group-hover:scale-[1.05]')}
        ${p.category ? `<span class="absolute top-4 left-4 font-label-sm text-[9px] text-primary-fixed uppercase tracking-widest border border-primary-fixed/40 bg-black/60 backdrop-blur-sm px-2.5 py-1 rounded-full">${esc(p.category)}</span>` : ''}
      </div>
      <div class="blog-card-body p-6">
        <span class="font-label-sm text-[10px] text-on-surface-variant/50 uppercase tracking-widest mb-3 block">${fmtDate(p.created_at)}</span>
        <h3 class="font-headline-lg-mobile text-[21px] text-primary uppercase tracking-tight leading-tight mb-3">${esc(p.title)}</h3>
        ${p.description ? `<p class="font-body-md text-on-surface-variant/80 text-[13px] mb-5 line-clamp-3">${esc(p.description)}</p>` : ''}
        <span class="inline-flex items-center gap-1.5 font-label-sm text-primary-fixed text-[10px] uppercase tracking-widest mt-auto">
          Read Article <span class="transition-transform duration-300 group-hover:translate-x-1" aria-hidden="true">→</span>
        </span>
      </div>
    </a>`).join('');
}

(async()=>{
  try {
    const res = await fetch(
      `${SB_URL}/rest/v1/posts?select=*&order=created_at.desc`,
      { headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` } }
    );
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    allPosts = await res.json();
  } catch(e) {
    console.error('[Blog] fetch error:', e);
    showStatus(`
      <span class="font-label-sm text-[10px] text-red-500 uppercase tracking-widest mb-3 block">Connection Failed</span>
      <p class="font-body-md text-on-surface-variant text-[14px] mb-2">Couldn't reach the archive. Refresh to try again.</p>
      <p class="font-label-sm text-[10px] text-on-surface-variant/40 uppercase tracking-widest mt-2">${esc(e.message)}</p>
    `);
    return;
  }
  if(!allPosts || !allPosts.length){
    showStatus(`
      <span class="font-label-sm text-[10px] text-primary-fixed uppercase tracking-widest mb-3 block">§ Archive Empty</span>
      <p class="font-body-md text-on-surface-variant text-[14px]">No transmissions logged yet — check back soon.</p>
    `);
    return;
  }
  renderCategories(allPosts);
  renderPosts();
})();
</script>
