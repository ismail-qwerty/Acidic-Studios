<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Blog — ACIDIC STUDIOS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

<script id="tailwind-config">
tailwind.config={darkMode:"class",theme:{extend:{"colors":{"surface-variant":"#353534","surface-container-high":"#2a2a2a","surface-container-low":"#1c1b1b","on-surface":"#e5e2e1","surface-deep":"#121212","primary-fixed":"#8bfe00","on-primary":"#1a3700","on-primary-fixed":"#0d2000","on-background":"#e5e2e1","primary-fixed-dim":"#7adf00","background":"#131313","primary-container":"#8bfe00","on-surface-variant":"#becbae","border-muted":"#262626","acid-glow":"#8CFF00CC","outline-variant":"#3f4a34","surface-container":"#201f1f","surface":"#131313","surface-container-lowest":"#0e0e0e","primary":"#ffffff","surface-tint":"#7adf00"},"borderRadius":{"DEFAULT":"0.125rem","lg":"0.25rem","xl":"0.5rem","full":"0.75rem"},"spacing":{"stack-sm":"8px","gutter":"24px","stack-md":"16px","margin-mobile":"16px","margin-desktop":"64px","stack-lg":"32px"},"fontFamily":{"body-md":["Inter"],"headline-xl":["Montserrat", "sans-serif"]},"fontSize":{"body-md":["16px",{"lineHeight":"1.6","fontWeight":"400"}],"headline-xl":["112px",{"lineHeight":"0.9","letterSpacing":"-0.02em","fontWeight":"400"}],"body-lg":["18px",{"lineHeight":"1.6","fontWeight":"400"}],"label-sm":["12px",{"lineHeight":"1","letterSpacing":"0.1em","fontWeight":"500"}],"headline-lg":["80px",{"lineHeight":"0.9","letterSpacing":"-0.01em","fontWeight":"400"}],"headline-lg-mobile":["64px",{"lineHeight":"0.9","fontWeight":"400"}]}}}}
</script>

</head>
<body class="font-body-md text-body-md antialiased selection:bg-primary-fixed selection:text-black">
<div id="navbar-placeholder"></div>
<main class="relative">
<section class="relative pt-40 pb-20 md:pt-48 md:pb-28 px-margin-mobile md:px-margin-desktop max-w-[1280px] mx-auto">
  <div class="absolute inset-0 bg-[linear-gradient(to_right,#262626_1px,transparent_1px),linear-gradient(to_bottom,#262626_1px,transparent_1px)] bg-[size:48px_48px] opacity-10 z-0 pointer-events-none"></div>
  <div class="relative z-10 flex items-center gap-2 text-red-500 font-label-sm text-label-sm uppercase tracking-widest mb-8 drop-shadow-[0_0_8px_rgba(255,0,0,0.8)]">
    <div class="w-2.5 h-2.5 rounded-full bg-red-500 rec-pulse"></div>
    TRANSMISSION_LOG // BLOG_V1
  </div>
  <h1 class="relative z-10 font-headline-xl text-[64px] sm:text-[88px] md:text-headline-xl text-primary uppercase tracking-tight leading-[0.85] mb-8">
    <span class="condensed-header">Signal</span><br>
    <span class="stencil-text condensed-header">Dispatch</span>
  </h1>
  <p class="relative z-10 font-body-lg text-body-lg text-on-surface-variant max-w-2xl border-l-2 border-primary-fixed pl-6">Thoughts, experiments, and field notes from the lab.</p>
</section>

<section class="py-16 max-w-[1280px] mx-auto px-margin-mobile md:px-margin-desktop pb-32">
  <div id="feedStatus" class="hidden mb-12 border border-border-muted bg-surface-container-lowest/50 px-8 py-10 text-center"></div>
  <div id="featuredPost" class="mb-12">
    <div class="border border-border-muted grid md:grid-cols-2 gap-0 animate-pulse">
      <div class="h-64 md:h-auto bg-surface-container-lowest"></div>
      <div class="p-8 md:p-12 flex flex-col justify-center gap-4">
        <div class="h-3 w-24 bg-surface-container-lowest"></div>
        <div class="h-8 w-3/4 bg-surface-container-lowest"></div>
        <div class="h-4 w-full bg-surface-container-lowest"></div>
        <div class="h-4 w-2/3 bg-surface-container-lowest"></div>
      </div>
    </div>
  </div>
  <div id="postsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div class="border border-border-muted animate-pulse"><div class="h-48 bg-surface-container-lowest"></div><div class="p-6 flex flex-col gap-3"><div class="h-3 w-16 bg-surface-container-lowest"></div><div class="h-5 w-5/6 bg-surface-container-lowest"></div><div class="h-4 w-full bg-surface-container-lowest"></div></div></div>
    <div class="border border-border-muted animate-pulse"><div class="h-48 bg-surface-container-lowest"></div><div class="p-6 flex flex-col gap-3"><div class="h-3 w-16 bg-surface-container-lowest"></div><div class="h-5 w-5/6 bg-surface-container-lowest"></div><div class="h-4 w-full bg-surface-container-lowest"></div></div></div>
    <div class="border border-border-muted animate-pulse hidden lg:block"><div class="h-48 bg-surface-container-lowest"></div><div class="p-6 flex flex-col gap-3"><div class="h-3 w-16 bg-surface-container-lowest"></div><div class="h-5 w-5/6 bg-surface-container-lowest"></div><div class="h-4 w-full bg-surface-container-lowest"></div></div></div>
  </div>
</section>
</main>
<div id="footer-placeholder"></div>
<script>
const SB_URL = 'https://npunrjejzvbjsxpsouuq.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wdW5yamVqenZianN4cHNvdXVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0Njg4NzEsImV4cCI6MjEwMDA0NDg3MX0.bFUZRI5se1mSD1bMwmh-kFN70gNk6gI-Ov3ysbFxCfc';

function esc(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function fallbackMedia(h){
  return `<div class="specimen-media relative w-full ${h}"></div>`;
}
function showStatus(html){
  const el = document.getElementById('feedStatus');
  el.innerHTML = html;
  el.classList.remove('hidden');
  document.getElementById('featuredPost').innerHTML = '';
  document.getElementById('postsGrid').innerHTML = '';
}

(async()=>{
  let data;
  try {
    const res = await fetch(
      `${SB_URL}/rest/v1/posts?select=*&order=created_at.desc`,
      { headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` } }
    );
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    data = await res.json();
  } catch(e) {
    console.error('[Blog] fetch error:', e);
    showStatus(`
      <span class="font-label-sm text-[10px] text-red-500 uppercase tracking-widest mb-3 block">Connection Failed</span>
      <p class="font-body-md text-on-surface-variant text-[14px] mb-2">Couldn't reach the archive. Refresh to try again.</p>
      <p class="font-label-sm text-[10px] text-on-surface-variant/40 uppercase tracking-widest mt-2">${esc(e.message)}</p>
    `);
    return;
  }
  if(!data || !data.length){
    showStatus(`
      <span class="font-label-sm text-[10px] text-primary-fixed uppercase tracking-widest mb-3 block">§ Archive Empty</span>
      <p class="font-body-md text-on-surface-variant text-[14px]">No transmissions logged yet — check back soon.</p>
    `);
    return;
  }

  const [featured, ...rest] = data;

  document.getElementById('featuredPost').innerHTML = `
    <a href="blog-post.html?slug=${encodeURIComponent(featured.slug)}" class="post-card group block md:grid md:grid-cols-2 gap-0">
      <div class="relative h-64 md:h-auto overflow-hidden">
        ${featured.image
          ? `<div class="w-full h-full bg-cover bg-center transition-transform duration-500 group-hover:scale-[1.03]" style="background-image:url('${esc(featured.image)}')"></div>
             <div class="absolute inset-0 bg-gradient-to-t md:bg-gradient-to-r from-black/60 via-transparent to-transparent"></div>`
          : fallbackMedia('h-full')}
        <span class="absolute top-5 left-5 font-label-sm text-[10px] text-primary-fixed uppercase tracking-widest border border-primary-fixed/40 bg-black/60 backdrop-blur-sm px-3 py-1.5">Latest</span>
      </div>
      <div class="p-8 md:p-12 flex flex-col justify-center">
        <div class="flex items-center gap-3 mb-4">
          ${featured.category ? `<span class="font-label-sm text-[10px] text-primary-fixed uppercase tracking-widest">${esc(featured.category)}</span><span class="w-1 h-1 rounded-full bg-border-muted"></span>` : ''}
          <span class="font-label-sm text-[10px] text-on-surface-variant/60 uppercase tracking-widest">${fmtDate(featured.created_at)}</span>
        </div>
        <h2 class="font-headline-lg text-[28px] md:text-[36px] text-primary uppercase tracking-tight leading-tight mb-4">${esc(featured.title)}</h2>
        ${featured.description ? `<p class="font-body-md text-on-surface-variant/80 text-[14px] mb-8 line-clamp-3">${esc(featured.description)}</p>` : ''}
        <span class="btn-explore self-start">Read Full Story<span aria-hidden="true">→</span></span>
      </div>
    </a>`;

  document.getElementById('postsGrid').innerHTML = rest.map(p => `
    <a href="blog-post.html?slug=${encodeURIComponent(p.slug)}" class="post-card group">
      <div class="relative h-48 overflow-hidden">
        ${p.image
          ? `<div class="w-full h-full bg-cover bg-center transition-transform duration-500 group-hover:scale-[1.03]" style="background-image:url('${esc(p.image)}')"></div>`
          : fallbackMedia('h-full')}
        ${p.category ? `<span class="absolute top-4 left-4 font-label-sm text-[9px] text-primary-fixed uppercase tracking-widest border border-primary-fixed/40 bg-black/60 backdrop-blur-sm px-2.5 py-1">${esc(p.category)}</span>` : ''}
      </div>
      <div class="p-6">
        <span class="font-label-sm text-[10px] text-on-surface-variant/50 uppercase tracking-widest mb-3 block">${fmtDate(p.created_at)}</span>
        <h3 class="font-headline-lg-mobile text-[20px] text-primary uppercase tracking-tight leading-tight mb-3">${esc(p.title)}</h3>
        ${p.description ? `<p class="font-body-md text-on-surface-variant/80 text-[13px] mb-5 line-clamp-2">${esc(p.description)}</p>` : ''}
        <span class="inline-flex items-center gap-1.5 font-label-sm text-primary-fixed text-[10px] uppercase tracking-widest">
          Read Article <span class="transition-transform duration-300 group-hover:translate-x-1" aria-hidden="true">→</span>
        </span>
      </div>
    </a>`).join('');
})();
</script>
<script src="assets/js/main.js"></script>
</body></html>
