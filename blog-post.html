  </div>

  <!-- Share / footer meta -->
  <div id="postFooterMeta" class="hidden mt-16 pt-8 border-t border-border-muted flex flex-col sm:flex-row sm:items-center justify-between gap-6">
    <span class="font-label-sm text-[10px] text-on-surface-variant/60 uppercase tracking-widest">End of Transmission</span>
    <div class="flex gap-3">
      <a id="shareX" href="#" target="_blank" rel="noopener noreferrer" class="icon-btn rounded-full" aria-label="Share on X"><span class="material-symbols-outlined text-[16px]">tag</span></a>
      <a id="shareLinkedIn" href="#" target="_blank" rel="noopener noreferrer" class="icon-btn rounded-full" aria-label="Share on LinkedIn"><span class="material-symbols-outlined text-[16px]">hub</span></a>
      <button id="copyLink" class="icon-btn rounded-full" aria-label="Copy link"><span class="material-symbols-outlined text-[16px]">link</span></button>

  <div id="morePosts" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5 md:gap-6"></div>
</section>

<div id="footer-placeholder"></div>

<script>
const sb = supabase.createClient('https://joeoakmtmlmuktitfawh.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpvZW9ha210bWxtdWt0aXRmYXdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0NzE1NDQsImV4cCI6MjEwMDA0NzU0NH0.gBaitQdIOjzWFrubisVI8YffTJd6APzvcAYVgW1fPk4');

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Real <img> with onerror fallback — a broken/expired image URL swaps to the
// chemical-grid placeholder instead of rendering nothing.
function media(src, alt, extraClass){
  const safeAlt = escapeHtml(alt || '');
  if (!src) return `<div class="specimen-media absolute inset-0"></div>`;
  return `
    <img src="${escapeHtml(src)}" alt="${safeAlt}" loading="lazy" decoding="async" class="${extraClass || ''}"
         onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'specimen-media absolute inset-0'}))">`;
}

function renderContent(raw){
  if(!raw) return '<p>No content yet.</p>';
  // If it already looks like HTML, trust it as-is (assumed to come from a rich text editor).
  if(/<\/?[a-z][\s\S]*>/i.test(raw)) return raw;
  // Otherwise treat as plain text, split into paragraphs on blank lines.
  return raw.split(/\n\s*\n/).map(p => `<p>${escapeHtml(p).replace(/\n/g,'<br>')}</p>`).join('');
}

function formatDate(d){
  if(!d) return '';
  try {
    return new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  } catch(e){ return ''; }
}

function readingTime(html){
  const text = (html || '').replace(/<[^>]+>/g, ' ');
  const words = text.trim().split(/\s+/).filter(Boolean).length;
  return Math.max(1, Math.round(words / 200));
}

function setMeta(id, attr, value){
  const el = document.getElementById(id);
  if (el) el.setAttribute(attr, value);
}

(async()=>{
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');

  if(!slug){
    document.getElementById('notFound').classList.remove('hidden');
    document.getElementById('postMeta').innerHTML = '';
    return;
  }

  const { data: post, error } = await sb.from('posts').select('*').eq('slug', slug).single();

  if(error || !post){
    document.getElementById('postMeta').innerHTML = '';
    document.getElementById('notFound').classList.remove('hidden');
  } else {
    document.title = `${post.title} — ACIDIC STUDIOS`;
    const desc = post.description || `${post.title} — a dispatch from the Acidic Studios lab.`;
    const url = window.location.href;
    setMeta('metaDescription', 'content', desc);
    setMeta('metaCanonical', 'href', url);
    setMeta('ogTitle', 'content', `${post.title} — ACIDIC STUDIOS`);
    setMeta('ogDescription', 'content', desc);
    setMeta('ogUrl', 'content', url);
    if (post.image) { setMeta('ogImage', 'content', post.image); setMeta('twitterImage', 'content', post.image); }
    setMeta('twitterTitle', 'content', `${post.title} — ACIDIC STUDIOS`);
    setMeta('twitterDescription', 'content', desc);
    if (post.category) setMeta('metaKeywords', 'content', `${post.category}, AI video production, AI agents, Acidic Studios, ${escapeHtml(post.title)}`);

    // Structured data — BlogPosting + breadcrumb, built from the loaded post
    const postingSchema = {
      "@context": "https://schema.org",
      "@type": "BlogPosting",
      "headline": post.title,
      "description": desc,
      "url": url,
      "datePublished": post.created_at || undefined,
      "dateModified": post.updated_at || post.created_at || undefined,
      "author": { "@type": post.author ? "Person" : "Organization", "name": post.author || "Acidic Studios" },
      "publisher": { "@type": "Organization", "name": "Acidic Studios", "url": "https://acidicstudios.netlify.app/" },
      "image": post.image || undefined,
      "articleSection": post.category || undefined,
      "mainEntityOfPage": { "@type": "WebPage", "@id": url }
    };
    Object.keys(postingSchema).forEach(k => postingSchema[k] === undefined && delete postingSchema[k]);
    document.getElementById('blogPostSchema').textContent = JSON.stringify(postingSchema);

    document.getElementById('breadcrumbSchema').textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://acidicstudios.netlify.app/"},
        {"@type": "ListItem", "position": 2, "name": "Blog", "item": "https://acidicstudios.netlify.app/blog.html"},
        {"@type": "ListItem", "position": 3, "name": post.title, "item": url}
      ]
    });

    document.getElementById('breadcrumb').innerHTML = `
      <a href="blog.html" class="hover:text-primary-fixed transition-colors">Blog</a>
      <span class="text-border-muted">/</span>
      <span class="text-primary-fixed">${post.category ? escapeHtml(post.category) : 'Dispatch'}</span>
    `;

    document.getElementById('postMeta').innerHTML = `
      <div class="flex items-center gap-2 text-red-500 font-label-sm text-label-sm uppercase tracking-widest mb-8 drop-shadow-[0_0_8px_rgba(255,0,0,0.8)]">
        <div class="w-2.5 h-2.5 rounded-full bg-red-500 rec-pulse"></div>
        TRANSMISSION_LOG // ${post.category ? escapeHtml(post.category).toUpperCase() : 'GENERAL'}
      </div>
      <h1 class="font-headline-lg text-primary uppercase tracking-tight leading-[1.05] mb-6 text-[32px] sm:text-[48px] md:text-[60px]">${escapeHtml(post.title)}</h1>
      ${post.description ? `<p class="font-body-lg text-body-lg text-on-surface-variant/80 mb-8 max-w-2xl">${escapeHtml(post.description)}</p>` : ''}
      <div class="flex flex-wrap items-center gap-4 font-label-sm text-[11px] text-on-surface-variant uppercase tracking-widest border-t border-border-muted pt-6">
        ${post.created_at ? `<span>${formatDate(post.created_at)}</span>` : ''}
        ${post.category ? `<span class="text-primary-fixed">${escapeHtml(post.category)}</span>` : ''}
        ${post.author ? `<span>By ${escapeHtml(post.author)}</span>` : ''}
        <span>${readingTime(post.content)} min read</span>
      </div>
    `;

    if(post.image){
      document.getElementById('postHero').innerHTML = media(post.image, post.title, 'absolute inset-0');
      document.getElementById('postHeroWrap').classList.remove('hidden');
    }

    document.getElementById('postContent').innerHTML = renderContent(post.content);
    document.getElementById('postFooterMeta').classList.remove('hidden');

    const shareUrl = encodeURIComponent(window.location.href);
    const shareTitle = encodeURIComponent(post.title);
    document.getElementById('shareX').href = `https://twitter.com/intent/tweet?url=${shareUrl}&text=${shareTitle}`;
    document.getElementById('shareLinkedIn').href = `https://www.linkedin.com/sharing/share-offsite/?url=${shareUrl}`;
    document.getElementById('copyLink').addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href);
      const icon = document.querySelector('#copyLink .material-symbols-outlined');
      const original = icon.textContent;
      icon.textContent = 'check';
      setTimeout(() => { icon.textContent = original; }, 1500);
    });
  }

  // Related / more posts
  const { data: more } = await sb.from('posts').select('*').neq('slug', slug).order('created_at', {ascending:false}).limit(3);
  const grid = document.getElementById('morePosts');
  if(!more || !more.length){
    grid.innerHTML = '<p class="font-label-sm text-[11px] text-on-surface-variant uppercase tracking-widest col-span-full">No other dispatches yet.</p>';
  } else {
    grid.innerHTML = more.map(p => `
      <a href="blog-post.html?slug=${encodeURIComponent(p.slug)}" class="blog-card group">
        <div class="blog-media relative h-44 sm:h-48">${media(p.image, p.title, 'absolute inset-0')}</div>
        <div class="p-6">
          ${p.category ? `<span class="font-label-sm text-[10px] text-primary-fixed uppercase tracking-widest mb-3 block">${escapeHtml(p.category)}</span>` : ''}
          <h3 class="font-headline-lg-mobile text-[20px] text-primary uppercase tracking-tight leading-tight mb-3">${escapeHtml(p.title)}</h3>
          <p class="font-body-md text-on-surface-variant/80 text-[13px] mb-4">${escapeHtml((p.description||'').substring(0,100))}${p.description && p.description.length>100 ? '...' : ''}</p>
          <span class="font-label-sm text-primary-fixed text-[10px] uppercase tracking-widest">Read →</span>
        </div>
      </a>`).join('');
  }
})();
</script>
<script src="assets/js/main.js" defer></script>
</body></html>
